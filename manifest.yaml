  ja_JP: "賢く、魂を持ち、成長し続ける Dify 版ロブスター。短期・長期メモリ、アイデンティティと性格、ホットスワップ可能なスキルを備え、使うほどあなたを理解する個人/企業向けアシスタント。"
  pt_BR: "Uma lagostinha inteligente, cheia de alma e em constante crescimento no Dify. Memória de curto e longo prazo, identidade e personalidade, skills trocáveis a quente — um assistente atento para você e sua empresa, que entende você melhor a cada dia."
