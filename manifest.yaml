version: 0.5.2
type: plugin
author: qiqikuaidianpao
name: my_claw
label:
  en_US: my_claw
  ja_JP: my_claw
  zh_Hans: my_claw
  pt_BR: my_claw
description:
  en_US: "A skill-driven agent with progressive disclosure, cross-session memory and hot-swappable skill packs. Modernized fork of mini_claw."
  zh_Hans: "技能渐进式披露 + 跨会话记忆 + 技能热插拔的智能体。基于 mini_claw 的现代化重构版。"
  ja_JP: "スキルの段階的開示、セッション横断メモリ、ホットスワップ可能なスキルパックを備えたエージェント。mini_claw の近代化フォーク。"
  pt_BR: "Um agente orientado a habilidades com divulgação progressiva, memória entre sessões e pacotes de habilidades substituíveis em tempo real. Fork modernizado do mini_claw."
icon: icon.svg
icon_dark: icon.svg
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
    endpoint:
      enabled: true
    app:
      enabled: true
    storage:
      enabled: true
      size: 104857600
plugins:
  tools:
    - provider/my_claw.yaml
meta:
  version: 0.5.2
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  # Keep low on purpose: must stay installable on older group Dify too.
  minimum_dify_version: null
created_at: "2026-08-14T18:00:00+08:00"
privacy: PRIVACY.md
verified: false
